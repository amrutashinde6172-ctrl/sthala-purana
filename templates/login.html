{% extends 'base.html' %}
{% block title %}Login – Sthala Purana{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card mx-auto">

      <div class="auth-card-header">
        <div class="auth-om">ॐ</div>
        <h3>Welcome Back</h3>
        <p class="text-muted">Login to continue your spiritual journey</p>
      </div>

      <!-- LOGIN FORM -->
      <form method="POST" action="{{ url_for('login') }}" autocomplete="off">

        <!-- EMAIL -->
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="your@email.com"
              required
              autocomplete="off"
            />
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>

            <input
              type="password"
              class="form-control"
              name="password"
              placeholder="Enter password"
              required
              autocomplete="new-password"
            />

            <button
              class="btn btn-outline-secondary"
              type="button"
              onclick="togglePassword(this)"
            >
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- REMEMBER + FORGOT -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="{{ url_for('reset_password') }}" class="text-saffron small">
            Forgot password?
           </a>
        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="btn btn-saffron w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>

        <!-- REGISTER LINK -->
        <div class="text-center mt-3">
          <span class="text-muted small">Don't have an account? </span>
          <a href="{{ url_for('register') }}" class="text-saffron fw-semibold">
            Register here
          </a>
        </div>

      </form>
    </div>
  </div>
</section>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>
function togglePassword(btn) {
  const input = btn.previousElementSibling;
  input.type = input.type === 'password' ? 'text' : 'password';

  btn.innerHTML =
    input.type === 'password'
      ? '<i class="bi bi-eye"></i>'
      : '<i class="bi bi-eye-slash"></i>';
}
</script>

{% endblock %}
