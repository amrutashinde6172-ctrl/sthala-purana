{% extends 'base.html' %}
{% block title %}Edit Profile – Sthala Purana{% endblock %}
{% block content %}
<section class="page-header">
  <div class="container">
    <h1><i class="bi bi-pencil-square me-3"></i>Edit Profile</h1>
  </div>
</section>
<section class="section-padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="content-card">
          <form method="POST" action="{{ url_for('edit_profile') }}">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" name="full_name" value="{{ current_user.full_name or '' }}" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone</label>
                <input type="tel" class="form-control" name="phone" value="{{ current_user.phone or '' }}" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input type="text" class="form-control" name="city" value="{{ current_user.city or '' }}" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">State</label>
                <input type="text" class="form-control" name="state" value="{{ current_user.state or '' }}" />
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Bio</label>
                <textarea class="form-control" name="bio" rows="4" placeholder="Tell us about yourself...">{{ current_user.bio or '' }}</textarea>
              </div>
              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-saffron"><i class="bi bi-check2 me-2"></i>Save Changes</button>
                <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
