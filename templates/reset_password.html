{% extends "base.html" %}
{% block title %}Reset Password – Sthala Purana{% endblock %}

{% block extra_css %}
<style>

.reset-wrapper{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3rem 1rem;
}

.reset-card{
    width:100%;
    max-width:520px;
    background:white;
    border-radius:24px;
    padding:2.5rem;
    border:1px solid var(--border);
    box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.reset-icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,var(--saffron),var(--gold));
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    margin-bottom:1.5rem;
}

.reset-title{
    text-align:center;
    font-family:'Cinzel',serif;
    color:var(--crimson);
}

.reset-sub{
    text-align:center;
    color:var(--text-light);
    margin-bottom:2rem;
}

.reset-form .form-group{
    margin-bottom:1rem;
}

.reset-form label{
    display:block;
    margin-bottom:.5rem;
    font-weight:600;
}

.reset-form input{
    width:100%;
    padding:1rem;
    border:1px solid #ddd;
    border-radius:12px;
}

.reset-btn{
    width:100%;
    border:none;
    padding:1rem;
    border-radius:12px;
    background:linear-gradient(135deg,var(--saffron),var(--gold));
    color:white;
    font-weight:700;
}

.reset-footer{
    text-align:center;
    margin-top:1rem;
}

.reset-footer a{
    color:var(--saffron);
    text-decoration:none;
    font-weight:600;
}

</style>
{% endblock %}

{% block content %}

<div class="reset-wrapper">

    <div class="reset-card">

        <div class="reset-icon">
            🔑
        </div>

        <h2 class="reset-title">Reset Your Password</h2>

        <p class="reset-sub">
            Enter your registered email and create a new password.
        </p>

        <form method="POST" class="reset-form">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="reset-btn">
                Update Password
            </button>

        </form>

        <div class="reset-footer">
            <a href="{{ url_for('login') }}">
                ← Back To Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
